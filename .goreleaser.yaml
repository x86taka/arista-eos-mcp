# goreleaser configuration. https://goreleaser.com
# Releases are tagged by release-please; this builds and attaches the binaries.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: arista-eos-mcp
    main: ./cmd/arista-eos-mcp
    binary: arista-eos-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: arista-eos-mcp
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - devices.example.json

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # release-please already writes CHANGELOG.md and the release notes.
  disable: true

release:
  # The GitHub Release is created by release-please; append the binaries to it.
  mode: append
