services:
  arista-eos-mcp:
    build: .
    image: arista-eos-mcp:latest
    container_name: arista-eos-mcp
    restart: unless-stopped
    # HTTP (Streamable) transport so the server can run as a long-lived service.
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_ADDR: ":8080"
      EOS_CONFIG: /config/devices.json
    ports:
      - "8080:8080"
    volumes:
      # Provide your device inventory at ./devices.json (see devices.example.json).
      - ./devices.json:/config/devices.json:ro
